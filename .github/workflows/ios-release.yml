name: Build and Distribute

on:
  push:
    branches:
      - main

jobs:
  build:
    name: build
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v2

      - name: Set up Xcode
        run: |
          set -euo pipefail
          ls /Applications | grep -i '^Xcode' || true
          if [ -d /Applications/Xcode_16.4.app/Contents/Developer ]; then
            sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer
          elif [ -d /Applications/Xcode.app/Contents/Developer ]; then
            sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          else
            XCODE_APP="$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1)"
            if [ -z "${XCODE_APP:-}" ]; then
              echo "No Xcode found in /Applications"
              exit 1
            fi
            sudo xcode-select -s "$XCODE_APP/Contents/Developer"
          fi
          xcode-select -p
          xcodebuild -version


      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.2'

      - uses: cedvdb/action-flutter-build-ios@v1
        with:
          build-cmd: flutter build ipa --release --obfuscate --split-debug-info=./symbols  --export-options-plist=ExportOptions.plist --no-tree-shake-icons    
          certificate-base64: 









          certificate-password: 123
          provisioning-profile-base64: 





          keychain-password: 111111
      - name: Archive IPA
        uses: actions/upload-artifact@v4
        with:
          name: release-ipa
          path: build/ios/ipa
      
      - name: Upload using iTMSTransporter
        env:
          WORKING_DIRECTORY: build/ios/ipa
          IPA_FILE_NAME: 彼颜.ipa
          APPLE_USERNAME: CrookshankMoench06@outlook.com
          APPLE_PASSWORD: aoia-fxzy-zfhf-tsna
          APPLE_ASC_PROVIDER: KNJ693MCA7
        run: |
          cd $WORKING_DIRECTORY
          git clone https://github.com/ZhangLi1984/itsm.git
          ./itsm/bin/iTMSTransporter -assetFile $IPA_FILE_NAME -u $APPLE_USERNAME -p $APPLE_PASSWORD -m upload -asc_provider $APPLE_ASC_PROVIDER

      - name: Clean project and update README
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"
          git remote set-url origin https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git
          git rm -rf .
          git clean -fxd
          echo "Last updated: $(date '+%Y-%m-%d %H:%M:%S')" > README.md
          git add README.md
          git commit -m "清空项目，仅保留更新时间戳的 README"
          git push origin main --force
